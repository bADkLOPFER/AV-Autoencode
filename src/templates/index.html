<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Encoding</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-6">
    
    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
        
        <!-- LINKE KACHEL: Steuerung -->
        <div class="bg-gray-800 rounded-xl shadow-2xl p-6 space-y-6 border border-gray-700">
            <h1 class="text-2xl font-bold text-blue-400">Video Encoding</h1>
            
            <form id="encodeForm" class="space-y-5">
                <!-- Versteckter Datei-Input & Pfad-Speicher -->
                <input type="file" id="fileInput" class="hidden">
                <input type="hidden" id="input_path" name="input_path" required>

                <!-- Drag & Drop / Klick Zone -->
                <div>
                    <label class="block text-sm font-medium mb-2 text-gray-300">Input Datei</label>
                    <div id="dropZone" class="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center cursor-pointer hover:border-blue-500 hover:bg-gray-750 transition bg-gray-900/50">
                        <p id="dropText" class="text-sm text-gray-400">Datei hierher ziehen oder <span class="text-blue-400 underline">durchsuchen</span></p>
                    </div>
                </div>
                <div id="progressContainer" class="hidden space-y-1">
                    <div class="flex justify-between text-xs text-gray-400">
                        <span>Upload-Fortschritt</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="w-full bg-gray-900 rounded-full h-2.5 overflow-hidden border border-gray-700">
                        <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-150" style="width: 0%"></div>
                    </div>
                </div>
                <!-- Codec & HDR (Grid) -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2 text-gray-300">Codec</label>
                        <div class="grid grid-cols-2 gap-1 bg-gray-900 p-1 rounded-lg border border-gray-700">
                            <label class="cursor-pointer text-center py-2 text-sm rounded-md transition font-medium text-gray-400 has-[:checked]:bg-blue-600 has-[:checked]:text-white">
                                <input type="radio" name="codec" value="hevc" checked class="hidden"> HEVC
                            </label>
                            <label class="cursor-pointer text-center py-2 text-sm rounded-md transition font-medium text-gray-400 has-[:checked]:bg-blue-600 has-[:checked]:text-white">
                                <input type="radio" name="codec" value="av1" class="hidden"> AV1
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2 text-gray-300">HDR Modus</label>
                        <div class="grid grid-cols-2 gap-1 bg-gray-900 p-1 rounded-lg border border-gray-700">
                            <label class="cursor-pointer text-center py-2 text-sm rounded-md transition font-medium text-gray-400 has-[:checked]:bg-blue-600 has-[:checked]:text-white">
                                <input type="radio" name="hdr_mode" value="normal" checked class="hidden"> Normal
                            </label>
                            <label class="cursor-pointer text-center py-2 text-sm rounded-md transition font-medium text-gray-400 has-[:checked]:bg-blue-600 has-[:checked]:text-white">
                                <input type="radio" name="hdr_mode" value="truehdr" class="hidden"> TrueHDR
                            </label>
                        </div>
                    </div>
                </div>

                <button type="submit" id="startBtn" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-lg font-bold transition shadow-lg shadow-blue-600/20">Encoding starten</button>
                <button type="button" id="cancelBtn" class="hidden w-full bg-gray-700 hover:bg-red-900 border border-red-600 text-red-500 p-3 rounded-lg font-bold transition mt-4">Abbrechen</button>
            </form>
        </div>

        <!-- RECHTE KACHEL: Reporting -->
        <div class="bg-gray-800 rounded-xl shadow-2xl p-6 flex flex-col h-full border border-gray-700">
            <h2 class="text-xl font-bold text-gray-200 mb-4">Live Reporting</h2>
            <div id="logBox" class="flex-grow bg-gray-950 rounded-lg p-4 font-mono text-xs text-green-400 overflow-y-auto h-[380px] border border-gray-800 space-y-1">
                <div class="text-gray-500">[System] Warte auf Datei...</div>
            </div>
            <div class="mt-4 pt-3 border-t border-gray-700 flex justify-between text-xs text-gray-400">
                <span>Status: <strong id="statusText" class="text-yellow-400">Bereit</strong></span>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const inputPath = document.getElementById('input_path');
        const dropText = document.getElementById('dropText');
        const logBox = document.getElementById('logBox');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        let selectedFile = null;
        let currentXhr = null;
        
        const ws = new WebSocket(`ws://${window.location.host}/ws/logs`);

        // Abbruch-Logik (Client-seitig angestoßen)
        cancelBtn.addEventListener('click', async () => {
            if(confirm("Encoding wirklich abbrechen?")) {
                
                // NEU: Sofort den laufenden Upload-Request im Browser abwürgen!
                if (currentXhr) {
                    currentXhr.abort();
                    currentXhr = null;
                }

                // Server informieren
                try {
                    const response = await fetch('/cancel-encode', { method: 'POST' });
                    const result = await response.json();
                    logBox.innerHTML += `<div class="text-red-500 font-bold">[Client] ${result.message}</div>`;
                } catch (e) {
                    // Falls Server nicht erreichbar
                }
                
                // UI zurücksetzen
                startBtn.disabled = false;
                startBtn.textContent = 'Encoding starten';
                cancelBtn.classList.add('hidden');
                cancelBtn.disabled = true;
                progressContainer.classList.add('hidden');
                progressBar.style.width = '0%';
                progressText.textContent = '0%';
                statusText.textContent = "Abgebrochen";
                statusText.className = "text-yellow-400";
            }
        });

        // Die zentrale Reset-Funktion (Wird NUR beim Erfolg aufgerufen)
        function resetUI() {
            startBtn.disabled = false;
            startBtn.textContent = 'Encoding starten';
            cancelBtn.classList.add('hidden');
            cancelBtn.disabled = true;
            
            // Fortschrittsanzeige verstecken & resetten
            progressContainer.classList.add('hidden');
            progressBar.style.width = '0%';
            progressText.textContent = '0%';
            
            // Korrekte IDs passend zum HTML
            fileInput.value = "";
            inputPath.value = "";
            dropText.innerHTML = 'Datei hierher ziehen oder <span class="text-blue-400 underline">durchsuchen</span>';
            selectedFile = null;
            
            statusText.textContent = "Bereit";
            statusText.className = "text-yellow-400";
        }

        ws.onmessage = (event) => {
            const msg = event.data;
            console.log("Nachricht vom Server:", JSON.stringify(msg));

            // 1. Wenn das explizite [UI_RESET]-Signal vom Server kommt (Erfolgsfall)
            if (msg.trim() === "[UI_RESET]") {
                console.log("SIGNAL ERKANNT: Starte resetUI()");
                statusText.textContent = "Bereit";
                statusText.className = "text-green-400";
                resetUI();
                return; // Abbrechen, damit es nicht im Log landet
            }

            logBox.innerHTML += `<div class="text-gray-300 font-mono text-xs">${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;

            // 2. Fehler- oder Server-seitige Abbruch-Erkennung
            // WICHTIG: Hier rufen wir absichtlich NICHT resetUI() auf!
            if (msg.includes("KRITISCHER FEHLER") || msg.includes("[JOB_CANCELLED]")) {
                statusText.textContent = "Fehler / Abgebrochen";
                statusText.className = "text-red-400";
                startBtn.disabled = false;
                startBtn.textContent = 'Encoding starten';
                cancelBtn.classList.add('hidden');
                cancelBtn.disabled = true;
                // Inputs (wie Datei und Codec) bleiben für den Nutzer sichtbar!
            }
        };

        async function uploadFile(file) {
            const CHUNK_SIZE = 50 * 1024 * 1024; // 50MB
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            
            for (let i = 0; i < totalChunks; i++) {
                const chunk = file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                const formData = new FormData();
                formData.append("file", chunk);
                formData.append("filename", file.name);
                formData.append("chunkIndex", i);
                formData.append("totalChunks", totalChunks);
                
                await fetch("/upload-chunk", {
                    method: "POST",
                    body: formData
                });
            }
        }

        // --- FILE HANDLING ---
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.add('border-blue-500', 'bg-gray-700'); }));
        ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.remove('border-blue-500', 'bg-gray-700'); }));

        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (file) {
                selectedFile = file; // Datei im globalen Scope merken
                inputPath.value = file.name;
                dropText.innerHTML = `<span class="text-green-400 font-bold">Gewählt: ${file.name}</span>`;
            }
        }

        // --- INIT: Defaults laden ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/config');
                const config = await response.json();
                if (config.defaults) {
                    const codecRadio = document.querySelector(`input[name="codec"][value="${config.defaults.codec}"]`);
                    if (codecRadio) codecRadio.checked = true;
                    const hdrRadio = document.querySelector(`input[name="hdr_mode"][value="${config.defaults.hdr_mode}"]`);
                    if (hdrRadio) hdrRadio.checked = true;
                }
            } catch (err) { console.error("Konnte Config nicht laden"); }
            // 2. Prüfen, ob im Hintergrund bereits ein Job läuft (F5-Synchronisation)
            try {
                const statusRes = await fetch('/status');
                const statusData = await statusRes.json();
                
                if (statusData.running) {
                    console.log("Aktiver Prozess nach F5 erkannt. Synchronisiere UI...");
                    startBtn.disabled = true;
                    startBtn.textContent = 'Encoding läuft...';
                    cancelBtn.classList.remove('hidden');
                    cancelBtn.disabled = false;
                    statusText.textContent = "Aktiv (Wiederhergestellt)";
                    statusText.className = "text-green-400";
                    
                    logBox.innerHTML += `<div class="text-yellow-400">[System] Seite neu geladen – Verbindung zu laufendem Job wiederhergestellt.</div>`;
                    logBox.scrollTop = logBox.scrollHeight;
                }
            } catch (err) {
                console.error("Konnte Job-Status nicht abrufen", err);
            }
        });

        // --- FORM SUBMIT ---
        document.getElementById('encodeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!inputPath.value) {
                alert("Bitte zuerst eine Datei auswählen oder per Drag & Drop hineinziehen!");
                return;
            }

            // UI auf "Laufen" setzen
            startBtn.disabled = true;
            startBtn.textContent = 'Encoding läuft...';
            cancelBtn.classList.remove('hidden'); // Button einblenden
            cancelBtn.disabled = false;
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressText.textContent = '0%';

            // Payload ohne die entfernten Checkboxen
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('codec', document.querySelector('input[name="codec"]:checked').value);
            formData.append('hdr_mode', document.querySelector('input[name="hdr_mode"]:checked').value);

            statusText.textContent = "Upload läuft...";
            statusText.className = "text-yellow-400";
            logBox.innerHTML += `<div class="text-blue-300">[Client] Sende Job an Server: ${selectedFile.name} (Codec: ${document.querySelector('input[name="codec"]:checked').value.toUpperCase()}, HDR: ${document.querySelector('input[name="hdr_mode"]:checked').value})</div>`;
            logBox.scrollTop = logBox.scrollHeight;

            // XMLHttpRequest für echten Upload-Fortschritt nutzen
            const xhr = new XMLHttpRequest();
            currentXhr = xhr; // Referenz speichern, um ggf. abzubrechen
            xhr.open('POST', '/start-encode', true);

            // Fortschritt abfangen
            xhr.upload.addEventListener('progress', (event) => {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = percentComplete + '%';
                    progressText.textContent = percentComplete + '%';
                    
                    if (percentComplete === 100) {
                        startBtn.textContent = 'Encoding läuft...';
                        statusText.textContent = "Verarbeite...";
                    }
                }
            });

            xhr.onload = () => {
                currentXhr = null; // Upload abgeschlossen, Referenz löschen
                try {
                    const result = JSON.parse(xhr.responseText);
                    if (xhr.status >= 200 && xhr.status < 300) {
                        statusText.textContent = "Aktiv";
                        statusText.className = "text-green-400";
                        logBox.innerHTML += `<div class="text-green-300">[Server] ${result.message || 'Encoding erfolgreich gestartet.'}</div>`;
                    } else {
                        throw new Error(result.detail ? JSON.stringify(result.detail) : "Serverfehler");
                    }
                } catch (err) {
                    statusText.textContent = "Fehler";
                    statusText.className = "text-red-400";
                    logBox.innerHTML += `<div class="text-red-400">[Server-Error] ${err.message}</div>`;
                    resetUI();
                }
                logBox.scrollTop = logBox.scrollHeight;
            };

            xhr.onerror = () => {
                currentXhr = null; // Upload fehlgeschlagen, Referenz löschen
                statusText.textContent = "Verbindungsfehler";
                statusText.className = "text-red-400";
                logBox.innerHTML += `<div class="text-red-400">[Error] Keine Verbindung zum Backend möglich.</div>`;
                resetUI();
                logBox.scrollTop = logBox.scrollHeight;
            };

            xhr.send(formData);
        });

    </script>
</body>
</html>
